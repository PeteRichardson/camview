# XcodeGen spec for the camgui app.
#
# camgui needs a real Xcode project because SPM can't build a sandboxed .app with
# entitlements, an asset catalog and a provisioning profile. Keeping the project as a
# generated artifact means this file — not a 500-line pbxproj — is the thing under review.
#
# Regenerate after editing:   cd camgui && xcodegen generate
# The generated camgui.xcodeproj is NOT committed.

name: camgui

options:
  bundleIdPrefix: com.peterichardson
  # Matches the floor Package.swift sets for CamviewCore, which this app links. It can't
  # go lower — the Protect dependency requires macOS 15 — and nothing in camgui needs
  # more: the newest API in use is ContentUnavailableView (macOS 14).
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  # The root SPM package, for the shared CamviewCore library. This replaces the old
  # pbxproj file-membership exception on camview/commands/config.swift.
  #
  # Protect is deliberately NOT declared here. camgui uses it directly, but reaches it
  # through CamviewCore, which re-exports it (Sources/CamviewCore/Protect.swift). A second
  # pin in this file is a second version that nothing keeps in agreement — and because
  # camgui resolves its own copy under Build/…/SourcePackages, the CLI and the GUI could
  # build against different Protect versions with no error. Package.swift holds the only pin.
  camview:
    path: ..

targets:
  camgui:
    type: application
    platform: macOS
    # Globbed, so a new file in camgui/ is compiled without editing this spec. An explicit
    # list meant a new .swift file was silently not built — no error, just absent
    # behaviour, which is the same class of invisible build configuration the SPM
    # migration removed when it deleted the pbxproj membership exception.
    #
    # The excludes are what make globbing safe. `Build` is the one that matters: Xcode puts
    # build output there, including SPM checkouts, and a recursive glob sweeps those into
    # the app's Resources ("Multiple commands produce ..."). That failure is why this was
    # an explicit list in the first place.
    sources:
      - path: .
        excludes:
          - Build              # build output, incl. SPM checkouts — the original failure
          - camgui.xcodeproj   # generated from this file
          - project.yml        # this file
          - camgui.entitlements  # referenced by CODE_SIGN_ENTITLEMENTS, not a compile input
          - ".derived-data-log-*"  # Xcode scratch, appears mid-build
          - ".DS_Store"
    dependencies:
      - package: camview
        product: CamviewCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peterichardson.camgui
        PRODUCT_NAME: camgui
        DEVELOPMENT_TEAM: RFDDK5QUG8
        CODE_SIGN_STYLE: Automatic
        # Relative to this project's own directory (camgui/), not the repo root.
        CODE_SIGN_ENTITLEMENTS: camgui.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SELECTED_FILES: readonly
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
